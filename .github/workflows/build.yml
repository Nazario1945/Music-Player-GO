name: Build Music Player GO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > project/app/release-key.jks
          test -s project/app/release-key.jks
          chmod 600 project/app/release-key.jks

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/project/app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          cd project
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayerGO-Release-Signed
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        run: rm -f project/app/release-key.jks
